<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Birthday Sayang! ❤️</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      overflow-x: hidden;
      padding: 20px;
    }

    .card {
      background: rgba(255, 255, 255, 0.95);
      padding: 25px;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
      max-width: 420px;
      width: 100%;
      position: relative;
      z-index: 10;
    }

    .media-container img, .media-container iframe {
      width: 100%;
      max-height: 250px;
      border-radius: 15px;
      object-fit: cover;
      margin-bottom: 15px;
    }

    h1 {
      color: #ff4b2b;
      font-size: 1.6rem;
      margin-bottom: 10px;
    }

    p {
      color: #555;
      font-size: 1rem;
      line-height: 1.5;
      margin-bottom: 20px;
    }

    .btn-group {
      display: flex;
      justify-content: center;
      gap: 15px;
      position: relative;
      min-height: 50px;
    }

    button {
      padding: 10px 25px;
      font-size: 1rem;
      font-weight: bold;
      border: none;
      border-radius: 25px;
      cursor: pointer;
      transition: transform 0.2s;
    }

    .btn-yes {
      background: #ff4b2b;
      color: white;
    }

    .btn-yes:hover {
      transform: scale(1.05);
    }

    .btn-no {
      background: #ccc;
      color: #333;
      position: absolute;
    }

    .heart {
      position: fixed;
      font-size: 1.5rem;
      top: -10vh;
      animation: fall linear infinite;
      z-index: 1;
    }

    @keyframes fall {
      to {
        transform: translateY(105vh) rotate(360deg);
      }
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="media-container" id="media-box">
      <img id="main-gif" src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExOHp1eHR6Z3V5ZnpsZnR6eXp5eG94ZXZvNXZ2Z3V5ZnpsZnR6eXp5ZSZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/LpDmM2wSt6Hm5fKJVa/giphy.gif" alt="Cute Stuffed Bear">
    </div>
    
    <h1 id="title">Happy Birthday, Sayang! 🎉✨</h1>
    
    <p id="text">
      Selamat ulang tahun sayangg, Terima kasih sudah hadir dan bikin hari-hari akuu jadi jauh lebih berwarna. Semoga kamu makin sehat, makin bahagia, dan sehat selalu ❤️
    </p>

    <div class="btn-group" id="btn-container">
      <button class="btn-yes" onclick="nextStep()">Klik Ini Dulu sayang 🎁</button>
    </div>
  </div>

  <script>
    function createHeart() {
      const heart = document.createElement('div');
      heart.classList.add('heart');
      heart.innerText = ['🌸', '✨', '💖', '🎀', '🎂'][Math.floor(Math.random() * 5)];
      heart.style.left = Math.random() * 100 + 'vw';
      heart.style.animationDuration = Math.random() * 3 + 2 + 's';
      document.body.appendChild(heart);

      setTimeout(() => heart.remove(), 5000);
    }
    setInterval(createHeart, 300);

    let step = 0;
    function nextStep() {
      const title = document.getElementById('title');
      const text = document.getElementById('text');
      const mediaBox = document.getElementById('media-box');
      const btnContainer = document.getElementById('btn-container');

      if (step === 0) {
        mediaBox.innerHTML = `<img src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExM3Z2ZnpsZnR6eXp5eG94ZXZvNXZ2Z3V5ZnpsZnR6eXp5ZSZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/kZqbBT64ECtjy/giphy.gif">`;
        title.innerText = "Jawab pertanyaan akuu duluu sayangg. 🥺";
        text.innerText = "Kamu bahagia kan sama akuu sejauh ini?";
        btnContainer.innerHTML = `
          <button class="btn-yes" onclick="nextStep()">Bahagia Banget! 🥰</button>
          <button class="btn-no" id="no-btn" onmouseover="dodge()">Nggak 😜</button>
        `;
        step = 1;
      } else if (step === 1) {
        mediaBox.innerHTML = `
          <iframe 
            width="100%" 
            height="230" 
            src="https://www.youtube.com/embed/Wyw-gdyomaY?autoplay=1" 
            title="YouTube video player" 
            frameborder="0" 
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
            allowfullscreen 
            style="border-radius: 15px;">
          </iframe>
        `;
        title.innerText = "Yeay!! Ini Spesial Buat Kamu! 🥳🎉";
        text.innerText = "halloo hallooo sleamattt ulangg tahunnnn sayangggkuuu, Semoga di ulang tahun kali ini sayangg selalu sehat dan selalu di perlancar semua urusannya aamiin allahumma aamiin 🤲, ohh iya sayang di ulang tahun kamu kali ini aku pengen ucapin terima kasih bannyak sayang kamu masih di sini bareng sama aku terus dan aku berharap samapai seterusnya kita bareng terusss dan bisa menggapai cita-cita atau mimpi-mimpi yang kita idam idamkan selama ini, dan nggaskk lupaa jugaa aku minta maaf juga ya sayangkuu kalau aku masih banyak salah dan kadang bikin ayangg kesell hehe 🤭. doa harapkan aku ke kamu adlahh semoga kamu menjadi pribadi yang jauh lebih baik lagi, lebih ceria lagi, selalu Bahagia dan pastinya selalu sehatt yaa sayanggg 🥰.akuu sayyangg bangettt samaaa ayangg ikee yang cantikk dann selaluu kiyowww kesayangann akuu😘 i loveee yooo soooo soooo muchhhhh muchhh mucchhhh ayangggg cantikk ❤️🥰💐. sekali lagi selamat ulang tahunnn sayangkuuu yeeyyyy yeyyyy yeyyy seleberasiii 👧🎉🎊🎉";
        btnContainer.innerHTML = `<button class="btn-yes" onclick="location.reload()">Ulangi Dari Awal 🔄</button>`;
      }
    }

    function dodge() {
      const noBtn = document.getElementById('no-btn');
      const x = Math.random() * 140 - 70;
      const y = Math.random() * 140 - 70;
      noBtn.style.transform = `translate(${x}px, ${y}px)`;
    }
  </script>
</body>
</html>
