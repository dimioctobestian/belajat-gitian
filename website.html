<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portfolio Saya</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --accent: #38bdf8;
      --text: #f8fafc;
      --text-dim: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .card {
      background-color: var(--card-bg);
      border-radius: 16px;
      padding: 32px;
      max-width: 480px;
      width: 100%;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.1);
      text-align: center;
    }

    .avatar {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent), #818cf8);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 36px;
      margin: 0 auto 20px;
    }

    h1 {
      font-size: 24px;
      margin-bottom: 8px;
    }

    p.subtitle {
      color: var(--accent);
      font-weight: 600;
      margin-bottom: 16px;
    }

    p.bio {
      color: var(--text-dim);
      font-size: 14px;
      line-height: 1.6;
      margin-bottom: 24px;
    }

    .links {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .btn {
      display: block;
      padding: 12px 20px;
      border-radius: 8px;
      background-color: rgba(255, 255, 255, 0.05);
      color: var(--text);
      text-decoration: none;
      font-weight: 500;
      transition: all 0.2s ease;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .btn:hover {
      background-color: var(--accent);
      color: var(--bg);
      transform: translateY(-2px);
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="avatar">👨‍💻</div>
    <h1>Nama Lu Di Sini</h1>
    <p class="subtitle">Developer / Tech Enthusiast</p>
    <p class="bio">
      Selamat datang di web gw! Gw suka ngulik teknologi, bikin projek seru, dan belajar hal baru setiap hari.
	  mari kita belajar
	  oke ini gw ubah di web github
    </p>

    <div class="links">
      <a href="https://github.com" target="_blank" class="btn">GitHub</a>
      <a href="https://linkedin.com" target="_blank" class="btn">LinkedIn</a>
      <a href="mailto:email@example.com" class="btn">Kirim Email</a>
    </div>
  </div>

</body>
</html>
